[package]
name = "configurator-api"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "HTTP backend for strata-configurator"

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
base64 = "=0.22.1"
configurator-core = { path = "../configurator-core" }
jsonwebtoken = "=10.3.0"
reqwest = { version = "=0.13.5", features = ["json"] }
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate", "macros", "json"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "=0.1.5"
libc = "=0.2.190"
rsa = { version = "=0.9.10", features = ["std"] }
testcontainers-modules = { version = "=0.15.0", features = ["postgres"] }
tower = { version = "=0.5.3", features = ["util"] }
