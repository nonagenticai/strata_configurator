[package]
name = "configurator-api"
version = "0.1.0"
edition = "2024"
description = "HTTP backend for strata-configurator"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
configurator-core = { path = "../configurator-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
