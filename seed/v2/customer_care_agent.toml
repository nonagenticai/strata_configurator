# Seed v2 — customer_care_agent job content (W4), job layer.
# Generated once from care-bus's golden release bundle v1
# (care-bus-agents feat/w3-multitenant crates/carebus-api/tests/fixtures/release-bundle-v1.json),
# so release 1 reproduces care-bus's base. Unset nullable fields are omitted (TOML has no null).

[[layer]]
scope = "job"
job = "customer_care_agent"

  [[layer.row]]
  kind = "job"
  key = "customer_care_agent"
  op = "patch"
    [layer.row.fields]
    preamble = "You are the intake step of a customer-care desk. From the customer's latest message, the draft request so far and the customer's recent records, extract the request type and any fields the message provides. Use order ids from the recent records when the customer names the item. Never invent a value: leave a field null when the message and records do not give it."
    actor_label = "Customer care desk"

  [[layer.row]]
  kind = "context_space"
  key = "retail:order-support:returns"
  op = "add"
    [layer.row.fields]
    area = "order-support"
    label = "Returns"
    request_type = "return"
    required = ["order_id", "reason"]
    entities = ["Customer", "Order", "Product", "ReturnAuthorization"]
    procedure = "return"

  [[layer.row]]
  kind = "context_space"
  key = "retail:order-support:warranty"
  op = "add"
    [layer.row.fields]
    area = "order-support"
    label = "Warranty claims"
    request_type = "warranty_claim"
    required = ["order_id", "defect"]
    entities = ["Customer", "Order", "Product", "WarrantyClaim"]
    procedure = "warranty_claim"

  [[layer.row]]
  kind = "context_space"
  key = "retail:logistics:delivery-status"
  op = "add"
    [layer.row.fields]
    area = "logistics"
    label = "Delivery status"
    request_type = "delivery_status"
    required = ["order_id"]
    entities = ["Order", "Shipment", "Carrier"]
    procedure = "delivery_status"

  [[layer.row]]
