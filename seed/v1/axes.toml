# Seed v1 — classifier axes (spec 4.3). Source: ~/Documents/01Quant/objects.txt.
# A value's parent is its dotted prefix; `axis = v` also holds for descendants of v.

[[axis]]
key = "customer_type"
label = "Customer type"
description = "Consumers (natural person, household) and legal entities (sole proprietorship, corporation, single representative of legal entities, conglomerate/committee)."
cardinality = "many"
values = [
  { key = "natural_person", label = "Natural person" },
  { key = "household", label = "Household" },
  { key = "sole_proprietorship", label = "Sole proprietorship" },
  { key = "corporation", label = "Corporation" },
  { key = "group_representative", label = "Representative of several legal entities" },
  { key = "conglomerate", label = "Conglomerate / committee" },
]

[[axis]]
key = "product_type"
label = "Product type"
description = "Service (consult), physical (pizza), virtual (e-book), access (lease, rental, SaaS), customer product (freemium)."
cardinality = "many"
values = [
  { key = "service", label = "Service product" },
  { key = "physical", label = "Physical product" },
  { key = "virtual", label = "Virtual product" },
  { key = "access_lease", label = "Access product (lease, rental, SaaS)" },
  { key = "freemium", label = "Freemium" },
]

[[axis]]
key = "offering_type"
label = "Product offering type"
description = "Availability (regular, seasonal, pre-order), combinatory (bundle, configurable), consumption (usage based)."
cardinality = "one"
values = [
  { key = "availability", label = "Availability" },
  { key = "availability.regular", parent = "availability", label = "Regular" },
  { key = "availability.seasonal", parent = "availability", label = "Seasonal / limited time" },
  { key = "availability.preorder", parent = "availability", label = "Pre-order / backorder" },
  { key = "combinatory", label = "Combinatory" },
  { key = "combinatory.bundle", parent = "combinatory", label = "Bundle / combo" },
  { key = "combinatory.configurable", parent = "combinatory", label = "Configurable / customizable" },
  { key = "consumption", label = "Consumption" },
  { key = "consumption.usage_based", parent = "consumption", label = "Usage based / pay per use" },
]

