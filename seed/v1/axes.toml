# Seed v1 — classifier axes (spec 4.3). Source: ~/Documents/01Quant/objects.txt.
# A value's parent is its dotted prefix; `axis = v` also holds for descendants of v.

# objects.txt customer-types: consumers (natural person, household) and legal entities (sole proprietorship, corporation, single representative of legal entities, conglomerate/committee).
[[axis]]
key = "customer_type"
cardinality = "many"
values = [
  { key = "natural_person" },
  { key = "household" },
  { key = "sole_proprietorship" },
  { key = "corporation" },
  { key = "group_representative" },
  { key = "conglomerate" },
]

# objects.txt product-types: service (consult), physical (pizza), virtual (e-book), access (lease/rental/saas), customer product (freemium).
[[axis]]
key = "product_type"
cardinality = "many"
values = [
  { key = "service" },
  { key = "physical" },
  { key = "virtual" },
  { key = "access_lease" },
  { key = "freemium" },
]

# objects.txt product-offering-types: availability (regular, seasonal/limited-time, pre-order/backorder), combinatory (bundle, configurable), consumeability (usage-based).
[[axis]]
key = "offering_type"
cardinality = "one"
values = [
  { key = "availability" },
  { key = "availability.regular", parent = "availability" },
  { key = "availability.seasonal", parent = "availability" },
  { key = "availability.preorder", parent = "availability" },
  { key = "combinatory" },
  { key = "combinatory.bundle", parent = "combinatory" },
  { key = "combinatory.configurable", parent = "combinatory" },
  { key = "consumption" },
  { key = "consumption.usage_based", parent = "consumption" },
]

# objects.txt order-types: discrete (ecommerce), recurring (subscription), continuous (electricity).
[[axis]]
key = "order_type"
cardinality = "one"
values = [
  { key = "discrete" },
  { key = "recurring" },
  { key = "continuous" },
]

# objects.txt order-renewal-types: no renewal, customer initiated, provider initiated (explicit, implicit).
[[axis]]
key = "renewal_type"
